[project]
name = "movie-project"
version = "0.1.0"
description = "A command-line movie database application that allows users to manage movies and their ratings and perform basic analytics."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "matplotlib>=3.11.2",
    "sqlalchemy>=2.1.3",
]

[tool.ruff.lint]
select = ["E", "F", "ANN201"]
